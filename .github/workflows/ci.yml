name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    uses: $/.github/workflows/gitleaks.yml
    permissions:
      contents: read

  # The same scan through the runs-on-json input, so every pull request exercises both runner paths.
  gitleaks-json:
    name: gitleaks (runs-on-json)
    uses: $/.github/workflows/gitleaks.yml
    with:
      runs-on-json: '["ubuntu-latest"]'
    permissions:
      contents: read

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
