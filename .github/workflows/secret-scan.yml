# The shared full-history secret scan of engineering-practices §7C.6. A repository calls it from its own CI with
#   uses: Vercroft/.github/.github/workflows/secret-scan.yml@<commit SHA> # <release>
# and keeps its own .gitleaks.toml at its root. It needs no secrets.
name: Secret scan

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label to run on; a private repository may pass its own runner switch value.
        type: string
        required: false
        default: ubuntu-latest
      runs-on-json:
        description: A full runs-on value as JSON, such as a runner group with labels. Used instead of runner when set.
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  scan:
    name: full history
    runs-on: ${{ inputs.runs-on-json != '' && fromJSON(inputs.runs-on-json) || inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Before the action, every time: it downloads gitleaks to the fixed file $TMPDIR/gitleaks.tmp and never deletes
      # it, so on a runner whose /tmp persists between jobs the next download fails because the file already exists.
      # On a fresh runner there is no such file and the step does nothing.
      - name: Remove the gitleaks action's leftover download
        run: rm -f -- "${TMPDIR:-/tmp}/gitleaks.tmp"
      # The action runs `gitleaks detect --redact` over the full history. Its SARIF report stays on the runner:
      # nothing is uploaded to code scanning.
      - uses: gacts/gitleaks@4fd785dcdaf557fda64e05b0ae033b8f7d82fb81 # v1.3.3
        with:
          version: 8.30.1
          config-path: .gitleaks.toml
