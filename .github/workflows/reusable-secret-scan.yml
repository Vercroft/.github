# The shared full-history secret scan of engineering-practices §7C.6. A repository calls it from its own CI with
#   uses: Vercroft/.github/.github/workflows/reusable-secret-scan.yml@<commit SHA> # <release>
# and keeps its own .gitleaks.toml at its root. It needs no secrets.
name: Reusable secret scan

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The job's runs-on value as JSON: a quoted label, a list of labels, or a runner group with labels."
        type: string
        required: false
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  full-history:
    name: Full history
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks by version and checksum (engineering-practices 7C.6), into the job's own temporary folder, which the
      # runner empties at the start and end of every job. No cache. Linux x64 only: every caller runs there today.
      - name: gitleaks 8.30.1, checked against its release checksum
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) asset=linux_x64; sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            *) echo "::error::no checked gitleaks archive for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz"
          echo "$sha  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # gitleaks' own full-history scan (`git`, which replaced `detect` in 8.19.0) with the caller's .gitleaks.toml.
      # Findings print redacted; any finding exits 1 and fails the check.
      - name: Scan for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .
