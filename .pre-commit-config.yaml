# Every small check is a hook (engineering-practices docs/required-checks.md): it runs at commit time, and CI's
# Repository checks job runs every hook once. The hook with stages: [manual] needs a tool most contributors do not
# have; CI runs it.
minimum_pre_commit_version: "4.4.0"
default_language_version:
  golang: 1.27.3
repos:
  # The git hook of standard §7C.6: gitleaks at commit time, with this repository's config.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]
  - repo: local
    hooks:
      - id: gate-summary
        name: Gate summary judges every CI job
        language: unsupported
        entry: python3 -B -m unittest discover -s tests
        files: ^(\.github/workflows/ci\.yml|tests/)
        pass_filenames: false
      # zizmor comes from .github/requirements/zizmor.txt (hash-pinned), not from its own hook repository, whose
      # python hook pre-commit would install without hashes.
      - id: zizmor
        name: zizmor
        language: unsupported
        entry: zizmor --offline .github/workflows
        files: ^\.github/workflows/
        pass_filenames: false
        stages: [manual]
